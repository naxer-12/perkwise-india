<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="olympus_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gold_metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#olympus_bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Guilloche Geometry Lines -->
  <circle cx="200" cy="126" r="100" fill="none" stroke="#d4af37" stroke-width="0.3" opacity="0.15" />
  <circle cx="200" cy="126" r="120" fill="none" stroke="#d4af37" stroke-width="0.3" opacity="0.12" />
  <circle cx="200" cy="126" r="140" fill="none" stroke="#d4af37" stroke-width="0.3" opacity="0.08" />

  <!-- Axis Burgundy Mark on Top Left -->
  <g transform="translate(26, 28)">
    <polygon points="0,16 10,0 20,16 14,16 10,9 6,16" fill="#881337" />
    <text x="26" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">AXIS BANK</text>
  </g>

  <!-- OLYMPUS Wordmark on Top Right -->
  <text x="374" y="42" text-anchor="end" fill="url(#gold_metallic)" font-family="serif" font-size="16" font-weight="900" letter-spacing="3">OLYMPUS</text>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_metallic)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#fbbf24" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="serif" font-size="15" font-weight="700" letter-spacing="1">AXIS BANK OLYMPUS</text>
  <text x="28" y="170" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">ULTRA-LUXURY TRAVEL &amp; CONCIERGE</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#fef08a" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 9901</text>
  <text x="28" y="228" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">UNLIMITED GLOBAL AIRPORT LOUNGE</text>

  <!-- Visa Infinite Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="2">INFINITE</text>
  </g>
</svg>
