<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="tata_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160626" />
      <stop offset="50%" stop-color="#2a0d47" />
      <stop offset="100%" stop-color="#18042b" />
    </linearGradient>
    <linearGradient id="neu_prism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#tata_bg)" stroke="#581c87" stroke-width="1.2" />

  <!-- Geometric Prism Facets in Background -->
  <polygon points="300,0 400,60 360,140 260,80" fill="url(#neu_prism)" opacity="0.12" />
  <polygon points="360,140 400,60 400,200 320,240" fill="url(#neu_prism)" opacity="0.08" />

  <!-- HDFC Bank Brand Top Left -->
  <g transform="translate(26, 26)">
    <rect width="18" height="18" rx="2" fill="#004c8f" />
    <rect x="5" y="5" width="8" height="8" rx="1" fill="#ed2324" />
    <rect x="7" y="2" width="4" height="14" fill="#ffffff" />
    <rect x="2" y="7" width="14" height="4" fill="#ffffff" />
    <text x="26" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1">HDFC BANK</text>
  </g>

  <!-- Tata Neu Brand Top Right -->
  <g transform="translate(300, 24)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">TATA</text>
    <text x="36" y="16" fill="url(#neu_prism)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="0.5">neu</text>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#c084fc" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Title -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">TATA NEU INFINITY RUPAY</text>
  <text x="28" y="170" fill="url(#neu_prism)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">5% NEUCOINS ON TATA BRANDS • 1.5% UPI</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f3e8ff" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 6015</text>
  <text x="28" y="228" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 05/29 • RUPAY ON UPI</text>

  <!-- RuPay Platinum Logo -->
  <g transform="translate(320, 204)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" font-style="italic" letter-spacing="0.5">RuPay</text>
    <text x="4" y="25" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" letter-spacing="1.5">PLATINUM</text>
  </g>
</svg>
