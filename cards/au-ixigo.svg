<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="ixigo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="60%" stop-color="#132742" />
      <stop offset="100%" stop-color="#0e1d33" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#ixigo_bg)" stroke="#1e3a5f" stroke-width="1.2" />

  <!-- Orange Flight Swoosh Arc Across Card -->
  <path d="M 0 160 C 140 220, 260 210, 400 120" fill="none" stroke="#f97316" stroke-width="2.5" opacity="0.75" />

  <!-- AU Small Finance Bank Top Left -->
  <g transform="translate(26, 24)">
    <circle cx="12" cy="12" r="12" fill="#ffffff" />
    <text x="6" y="16" fill="#0b1728" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900">AU</text>
    <text x="28" y="11" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">AU SMALL FINANCE</text>
    <text x="28" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">BANK</text>
  </g>

  <!-- ixigo Brand Top Right -->
  <g transform="translate(305, 24)">
    <text x="0" y="16" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="0.5">ixigo</text>
    <!-- Little Plane Icon -->
    <path d="M 52 8 L 62 12 L 56 14 L 54 18 L 52 14 Z" fill="#f97316" />
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#f97316" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Title -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">AU IXIGO TRAVEL CARD</text>
  <text x="28" y="170" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">ZERO FOREX MARKUP • 16 RAILWAY LOUNGES</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f0f9ff" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 9180</text>
  <text x="28" y="228" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 09/28 • TRAVEL &amp; TRANSIT</text>

  <!-- Visa Signature Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">SIGNATURE</text>
  </g>
</svg>
