<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="kiwi_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="60%" stop-color="#141417" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#kiwi_bg)" stroke="#27272a" stroke-width="1.5" />

  <!-- Axis Bank Burgundy Mark on Top Left -->
  <g transform="translate(26, 28)">
    <polygon points="0,16 10,0 20,16 14,16 10,9 6,16" fill="#881337" />
    <text x="26" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">AXIS BANK</text>
  </g>

  <!-- Kiwi Neon Brand Mark on Top Right -->
  <g transform="translate(325, 24)">
    <circle cx="12" cy="12" r="12" fill="#84cc16" />
    <circle cx="12" cy="12" r="9" fill="#14532d" />
    <circle cx="12" cy="12" r="4" fill="#84cc16" />
    <text x="28" y="17" fill="#84cc16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">kiwi</text>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves in Neon Green -->
  <g transform="translate(86, 85)" stroke="#a3e635" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">KIWI AXIS RUPAY CARD</text>
  <text x="28" y="170" fill="#a3e635" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SCAN &amp; PAY UPI CASHBACK</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f4f4f5" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 3310</text>
  <text x="28" y="228" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">LIFETIME FREE • UPI POWERED</text>

  <!-- RuPay Platinum Logo -->
  <g transform="translate(320, 204)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" font-style="italic" letter-spacing="0.5">RuPay</text>
    <text x="4" y="25" fill="#a3e635" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" letter-spacing="1.5">PLATINUM</text>
  </g>
</svg>
