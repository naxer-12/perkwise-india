<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="hsbc_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="60%" stop-color="#1a1a1d" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#hsbc_bg)" stroke="#27272a" stroke-width="1.2" />

  <!-- Red Accent Edge on the Right -->
  <rect x="394" y="16" width="6" height="220" rx="3" fill="#dc2626" />

  <!-- HSBC Hexagon Logo Top Left -->
  <g transform="translate(26, 24)">
    <polygon points="0,11 6,0 18,0 24,11 18,22 6,22" fill="#ffffff" />
    <polygon points="0,11 6,0 12,11" fill="#db0011" />
    <polygon points="24,11 18,0 12,11" fill="#db0011" />
    <polygon points="6,22 18,22 12,11" fill="#db0011" />
    <text x="32" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="1">HSBC</text>
  </g>

  <!-- Live+ Wordmark Top Right -->
  <g transform="translate(325, 26)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="0.5">Live</text>
    <text x="36" y="16" fill="#dc2626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">+</text>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#ef4444" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">HSBC LIVE+ CREDIT CARD</text>
  <text x="28" y="170" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">10% CASHBACK ON DINING &amp; GROCERIES</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f4f4f5" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 3456</text>
  <text x="28" y="228" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 10/29 • GLOBAL RECOGNITION</text>

  <!-- Visa Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">SIGNATURE</text>
  </g>
</svg>
