<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="scapia_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a231d" />
      <stop offset="60%" stop-color="#0f332a" />
      <stop offset="100%" stop-color="#144238" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#scapia_bg)" stroke="#115e59" stroke-width="1.2" />

  <!-- Scapia Compass Logo Top Left -->
  <g transform="translate(26, 26)">
    <!-- Compass Icon -->
    <circle cx="12" cy="12" r="10" fill="none" stroke="#22d3ee" stroke-width="2" />
    <polygon points="12,5 15,12 12,19 9,12" fill="#22d3ee" />
    <line x1="12" y1="0" x2="12" y2="4" stroke="#22d3ee" stroke-width="2" />
    <line x1="12" y1="20" x2="12" y2="24" stroke="#22d3ee" stroke-width="2" />
    <line x1="0" y1="12" x2="4" y2="12" stroke="#22d3ee" stroke-width="2" />
    <line x1="20" y1="12" x2="24" y2="12" stroke="#22d3ee" stroke-width="2" />
    <text x="32" y="18" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="1">SCAPIA</text>
  </g>

  <!-- Federal Bank Badge Top Right -->
  <g transform="translate(285, 24)">
    <rect width="90" height="22" rx="3" fill="#004c8f" />
    <rect x="0" y="20" width="90" height="2" fill="#f59e0b" />
    <text x="45" y="15" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" letter-spacing="0.5">FEDERAL BANK</text>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#22d3ee" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">FEDERAL SCAPIA CO-BRAND</text>
  <text x="28" y="170" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">ZERO FOREX MARKUP • UNLIMITED LOUNGE</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#ccfbf1" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 4589</text>
  <text x="28" y="228" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 11/29 • GLOBAL TRAVELLER</text>

  <!-- Visa Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">SIGNATURE</text>
  </g>
</svg>
