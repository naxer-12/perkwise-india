<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="millennia_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071e3d" />
      <stop offset="60%" stop-color="#0e3a6c" />
      <stop offset="100%" stop-color="#082b52" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#millennia_bg)" stroke="#1d4ed8" stroke-width="1.2" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="0.8" fill="none">
    <polygon points="260,0 300,20 260,40 220,20" />
    <polygon points="300,20 340,40 300,60 260,40" />
    <polygon points="340,40 380,60 340,80 300,60" />
    <polygon points="260,40 300,60 260,80 220,60" />
    <polygon points="300,60 340,80 300,100 260,80" />
    <polygon points="340,80 380,100 340,120 300,100" />
  </g>

  <!-- HDFC Bank Brand Top Left -->
  <g transform="translate(26, 26)">
    <rect width="18" height="18" rx="2" fill="#004c8f" />
    <rect x="5" y="5" width="8" height="8" rx="1" fill="#ed2324" />
    <rect x="7" y="2" width="4" height="14" fill="#ffffff" />
    <rect x="2" y="7" width="14" height="4" fill="#ffffff" />
    <text x="26" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1">HDFC BANK</text>
  </g>

  <!-- Top Right Instrument -->
  <text x="374" y="38" text-anchor="end" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">CREDIT</text>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#38bdf8" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- MILLENNIA Wordmark in Vibrant Cyan -->
  <text x="28" y="152" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="2">MILLENNIA</text>
  <text x="28" y="170" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">5% CASHBACK ON AMAZON, FLIPKART &amp; SWIGGY</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f0f9ff" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 7219</text>
  <text x="28" y="228" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 09/29 • CASH POINTS AUTO-CREDIT</text>

  <!-- Visa Signature Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">SIGNATURE</text>
  </g>
</svg>
