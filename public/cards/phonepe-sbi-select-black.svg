<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="phonepe_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e081c" />
      <stop offset="60%" stop-color="#190e33" />
      <stop offset="100%" stop-color="#241448" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#phonepe_bg)" stroke="#3b1d6e" stroke-width="1.2" />

  <!-- Background Violet Arc -->
  <path d="M 0 60 C 150 40, 260 90, 400 30 L 400 0 L 0 0 Z" fill="#6d28d9" opacity="0.2" />

  <!-- PhonePe Logo Top Left -->
  <g transform="translate(26, 26)">
    <circle cx="11" cy="11" r="11" fill="#5f259f" />
    <text x="6" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900">पे</text>
    <text x="28" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="0.5">PhonePe</text>
  </g>

  <!-- SBI Card Logo Top Right -->
  <g transform="translate(295, 26)">
    <circle cx="9" cy="9" r="9" fill="#00a5df" />
    <circle cx="9" cy="8" r="3.5" fill="#190e33" />
    <rect x="8" y="8" width="2" height="6" fill="#190e33" />
    <text x="24" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">SBI card</text>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#a78bfa" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Title -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">PHONEPE SBI SELECT BLACK</text>
  <text x="28" y="170" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">UPI POWERED • AIRPORT LOUNGE PERKS</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#ede9fe" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 3456</text>
  <text x="28" y="228" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 10/29 • RUPAY UPI ENABLED</text>

  <!-- RuPay Platinum Logo -->
  <g transform="translate(320, 204)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" font-style="italic" letter-spacing="0.5">RuPay</text>
    <text x="4" y="25" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="800" letter-spacing="1.5">PLATINUM</text>
  </g>
</svg>
