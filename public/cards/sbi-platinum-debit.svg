<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="sbi_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#sbi_bg)" stroke="#38bdf8" stroke-width="1" />

  <!-- SBI Keyhole Logo & Brand Top Left -->
  <g transform="translate(26, 26)">
    <circle cx="10" cy="10" r="10" fill="#ffffff" />
    <circle cx="10" cy="9" r="4" fill="#0369a1" />
    <rect x="9" y="9" width="2" height="7" fill="#0369a1" />
    <text x="26" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">State Bank of India</text>
  </g>

  <!-- Platinum International Top Right -->
  <text x="374" y="38" text-anchor="end" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1">INTERNATIONAL</text>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#e0f2fe" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">SBI PLATINUM DEBIT CARD</text>
  <text x="28" y="170" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">DOMESTIC LOUNGE 2/QTR • HIGH ATM LIMIT</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f0f9ff" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 3499</text>
  <text x="28" y="228" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 06/30 • PLATINUM SPECIMEN</text>

  <!-- Visa Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">PLATINUM</text>
  </g>
</svg>
