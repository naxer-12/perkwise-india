<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="wealth_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#340514" />
      <stop offset="50%" stop-color="#4c081e" />
      <stop offset="100%" stop-color="#26030e" />
    </linearGradient>
    <linearGradient id="gold_foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#b48b2a" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#wealth_bg)" stroke="#831843" stroke-width="1.2" />

  <!-- Luxury Guilloche Fan Art in Corners -->
  <g stroke="url(#gold_foil)" stroke-width="0.7" fill="none" opacity="0.35">
    <path d="M 400 0 C 340 10, 310 50, 310 110" />
    <path d="M 400 0 C 350 20, 330 60, 330 110" />
    <path d="M 400 0 C 360 30, 350 70, 350 110" />
    <path d="M 400 0 C 370 40, 370 80, 370 110" />
    <path d="M 310 110 C 330 100, 370 100, 400 110" />
    <path d="M 310 80 C 340 70, 370 70, 400 80" />
    <path d="M 310 50 C 340 40, 370 40, 400 50" />
  </g>

  <!-- IDFC FIRST Bank Brand Top Left -->
  <g transform="translate(26, 26)">
    <rect width="20" height="20" rx="3" fill="#991b1b" />
    <text x="5" y="15" fill="#ffffff" font-family="serif" font-size="14" font-weight="900">1</text>
    <text x="28" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">IDFC FIRST Bank</text>
  </g>

  <!-- Top Right Instrument -->
  <text x="374" y="38" text-anchor="end" fill="url(#gold_foil)" font-family="serif" font-size="12" font-weight="900" letter-spacing="1.5">WEALTH</text>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves in Gold -->
  <g transform="translate(86, 85)" stroke="url(#gold_foil)" stroke-width="1.8" fill="none" opacity="0.9">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="url(#gold_foil)" font-family="serif" font-size="14" font-weight="700" letter-spacing="0.5">WEALTH DEBIT CARD</text>
  <text x="28" y="170" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">BOGO MOVIE TICKETS ₹500 • AIRPORT LOUNGE SPA</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="url(#gold_foil)" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 4444</text>
  <text x="28" y="228" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 09/28 • PREMIER WEALTH SPECIMEN</text>

  <!-- Visa Infinite Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="url(#gold_foil)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="url(#gold_foil)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="2">INFINITE</text>
  </g>
</svg>
