<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="apay_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#222226" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <linearGradient id="amazon_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#apay_bg)" stroke="#3f3f46" stroke-width="1.2" />

  <!-- Dual Tone Curved Wave -->
  <path d="M 0 100 C 120 90, 200 130, 260 252 L 0 252 Z" fill="#2e2e34" opacity="0.6" />

  <!-- ICICI Bank Brand Top Left -->
  <g transform="translate(26, 26)">
    <circle cx="10" cy="10" r="10" fill="#f97316" />
    <text x="6" y="15" fill="#ffffff" font-family="serif" font-size="14" font-weight="900" font-style="italic">i</text>
    <text x="26" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">ICICI Bank</text>
  </g>

  <!-- Amazon Pay Top Right -->
  <g transform="translate(265, 24)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">amazon</text>
    <rect x="62" y="1" width="38" height="19" rx="3" fill="#f59e0b" />
    <text x="81" y="15" text-anchor="middle" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900">pay</text>
    <!-- Amazon Smile -->
    <path d="M 5 21 C 25 28, 48 25, 58 19" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" />
    <polygon points="56,16 62,20 57,23" fill="#f59e0b" />
  </g>

  <!-- Prime Badge -->
  <g transform="translate(325, 60)">
    <text x="0" y="14" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" font-style="italic">Prime</text>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#fbbf24" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">AMAZON PAY ICICI</text>
  <text x="28" y="170" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">5% UNLIMITED ON AMAZON • LIFETIME FREE</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f4f4f5" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 6789</text>
  <text x="28" y="228" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 08/28 • PLATINUM SPECIMEN</text>

  <!-- Visa Platinum Logo -->
  <g transform="translate(325, 202)">
    <text x="0" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="1">VISA</text>
    <text x="2" y="28" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">PLATINUM</text>
  </g>
</svg>
