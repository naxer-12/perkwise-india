<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="airtel_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#640922" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#airtel_bg)" stroke="#9f1239" stroke-width="1.2" />

  <!-- Subtle Brushed Streak Lines -->
  <line x1="0" y1="50" x2="400" y2="50" stroke="#be123c" stroke-width="0.5" opacity="0.3" />
  <line x1="0" y1="120" x2="400" y2="120" stroke="#be123c" stroke-width="0.5" opacity="0.2" />
  <line x1="0" y1="190" x2="400" y2="190" stroke="#be123c" stroke-width="0.5" opacity="0.25" />

  <!-- Airtel Brand Top Left -->
  <g transform="translate(26, 26)">
    <!-- Airtel Swoosh -->
    <path d="M 0 14 C 0 6, 8 0, 14 0 C 18 0, 20 4, 18 8 C 16 12, 11 15, 6 15 C 2 15, 0 14, 0 14 Z" fill="#ffffff" />
    <text x="26" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" letter-spacing="0.5">airtel</text>
  </g>

  <!-- Axis Bank Top Right -->
  <g transform="translate(285, 24)">
    <polygon points="0,16 10,0 20,16 14,16 10,9 6,16" fill="#ffffff" />
    <text x="24" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">AXIS BANK</text>
  </g>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#fda4af" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">AIRTEL AXIS BANK CARD</text>
  <text x="28" y="170" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">25% AIRTEL BILLS • 10% UTILITIES &amp; SWIGGY</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#fce7f3" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 9012</text>
  <text x="28" y="228" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 10/28 • UTILITY CHAMPION</text>

  <!-- Mastercard Logo -->
  <g transform="translate(330, 195)">
    <circle cx="16" cy="16" r="16" fill="#EB001B" />
    <circle cx="34" cy="16" r="16" fill="#F79E1B" fill-opacity="0.88" />
    <text x="25" y="38" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">mastercard</text>
  </g>
</svg>
