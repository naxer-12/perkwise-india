<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" width="100%" height="100%">
  <defs>
    <linearGradient id="atlas_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191124" />
      <stop offset="50%" stop-color="#281a38" />
      <stop offset="100%" stop-color="#140a1c" />
    </linearGradient>
    <linearGradient id="silver_metallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="gold_chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <rect width="400" height="252" rx="16" fill="url(#atlas_bg)" stroke="#3b2d54" stroke-width="1.2" />

  <!-- Topographic Contour Lines in Background -->
  <path d="M 120 0 C 180 60, 240 40, 400 90" fill="none" stroke="#a855f7" stroke-width="0.7" opacity="0.25" />
  <path d="M 80 0 C 160 80, 220 70, 400 130" fill="none" stroke="#a855f7" stroke-width="0.7" opacity="0.2" />
  <path d="M 40 0 C 140 100, 200 100, 400 170" fill="none" stroke="#a855f7" stroke-width="0.7" opacity="0.15" />

  <!-- Axis Bank Top Left -->
  <g transform="translate(26, 26)">
    <polygon points="0,16 10,0 20,16 14,16 10,9 6,16" fill="#881337" />
    <text x="26" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="0.5">AXIS BANK</text>
  </g>

  <!-- ATLAS Wordmark Top Right -->
  <text x="374" y="40" text-anchor="end" fill="url(#silver_metallic)" font-family="serif" font-size="18" font-weight="900" letter-spacing="3">ATLAS</text>

  <!-- EMV Gold Chip -->
  <g transform="translate(28, 76)">
    <rect width="46" height="34" rx="4" fill="url(#gold_chip)" stroke="#92400e" stroke-width="0.8" />
    <line x1="0" y1="11" x2="46" y2="11" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="0" y1="23" x2="46" y2="23" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="16" y1="0" x2="16" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
    <line x1="30" y1="0" x2="30" y2="34" stroke="#854d0e" stroke-width="0.7" opacity="0.6" />
  </g>

  <!-- Contactless Waves -->
  <g transform="translate(86, 85)" stroke="#c084fc" stroke-width="1.8" fill="none" opacity="0.85">
    <path d="M 0 0 A 6 6 0 0 1 0 16" />
    <path d="M 4 -3 A 10 10 0 0 1 4 19" />
    <path d="M 8 -6 A 14 14 0 0 1 8 22" />
  </g>

  <!-- Card Info -->
  <text x="28" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">AXIS ATLAS TRAVEL</text>
  <text x="28" y="170" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">5 EDGE MILES ON TRAVEL • 1:2 MILE CONVERSION</text>

  <!-- Card Numbers -->
  <text x="28" y="210" fill="#f3e8ff" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="700" letter-spacing="3.5">•••• •••• •••• 3210</text>
  <text x="28" y="228" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">VAL 09/28 • WORLD EDITION</text>

  <!-- Mastercard World Emblem -->
  <g transform="translate(330, 195)">
    <circle cx="16" cy="16" r="16" fill="#94a3b8" />
    <circle cx="34" cy="16" r="16" fill="#cbd5e1" fill-opacity="0.85" />
    <text x="25" y="38" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="0.5">world</text>
  </g>
</svg>
